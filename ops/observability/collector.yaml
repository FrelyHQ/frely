extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  transform/sanitize:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment", "deployment.environment.name", "friday.release", "friday.runtime_fingerprint"])
      - context: span
        statements:
          - set(name, "next.framework") where not IsMatch(name, "^friday\\.")
          - set(status.message, "") where status.message != nil
          - keep_keys(attributes, ["service", "route", "terminal", "operation", "surface_type", "surface_name", "result", "release", "browser.duration_ms", "friday.collection.page_size", "friday.collection.items_returned", "db.response.returned_rows"])
      - context: spanevent
        statements:
          - set(name, "event")
          - keep_keys(attributes, [])
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment", "deployment.environment.name", "friday.release", "friday.runtime_fingerprint"])
      - context: datapoint
        statements:
          - keep_keys(attributes, ["service", "surface_type", "surface_name", "result", "release", "route", "bucket", "decision", "source"])
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 2s

exporters:
  otlphttp/signoz:
    endpoint: http://ingester:4318
    timeout: 3s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: normal
      readers:
        - periodic:
            interval: 10000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://ingester:4318
                timeout: 3000
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/sanitize, batch]
      exporters: [otlphttp/signoz]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/sanitize, batch]
      exporters: [otlphttp/signoz]
